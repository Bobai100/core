poll_interval_seconds = 10
# Optional: how often the poller logs a periodic summary line, in seconds.
# Set to 0 to disable the periodic summary entirely. Default: 60.
# summary_interval_seconds = 60
# Optional: maximum number of contracts polled concurrently in a single
# `watch --once` run. Defaults to 10. Lower it if Horizon rate-limits you.
# concurrency = 10

[[contracts]]
label       = "My Escrow Contract"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4"
network     = "testnet"
webhook_url = "https://hooks.example.com/my-webhook"
# webhook_secret = "my-secret-token"   # optional: HMAC-SHA256 signature sent as X-TxWatch-Signature header

  [[contracts.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 10000

  # Only count balance changes where the watched contract is the sender.
  # direction must be one of: "in" / "out" / "any" (default "any").
  [[contracts.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 10000
  direction     = "out"

  # Alert whenever the contract's executable (WASM) changes, e.g. via
  # `update_current_contract_wasm`. The payload includes the old/new WASM hash.
  [[contracts.rules]]
  type     = "ContractUpgraded"
  severity = "critical"

  # Match a SEP-41 `transfer` event with an amount >= 1000 (i128 compared as an
  # integer). `data` matchers use JSON pointers into the decoded event data and
  # support `eq`, `gte` and `lte`.
  [[contracts.rules]]
  type = "EventEmitted"
  # topic 0 may be any scalar ScVal; typed patterns like "address:G...",
  # "u32:5" or "symbol:transfer" constrain the ScVal type.
  topic = ["symbol:transfer"]
    [[contracts.rules.data]]
    pointer = "/amount"
    gte     = 1000

  # Match an `admin_changed` event whose data is a specific address.
  [[contracts.rules]]
  type = "EventEmitted"
  topic = ["symbol:admin_changed"]
    [[contracts.rules.data]]
    pointer = "/admin"
    eq      = "GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA"

  # A composite rule; its nested entries are `RuleEntry`, which supports the
  # per-rule `webhook_url` / `severity` / `enabled` overrides.
  [[contracts.rules]]
  type = "All"
    [[contracts.rules.rules]]
    type           = "AdminFunctionCalled"
    function_names = ["set_admin", "upgrade", "initialize"]
    webhook_url    = "https://hooks.example.com/critical-webhook"  # per-rule override
    severity       = "critical"

    [[contracts.rules.rules]]
    type = "TransactionFailed"

  [[contracts.rules]]
  type = "TransactionFailed"

[[contracts]]
label       = "Mainnet Vault"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQC526"
network     = "mainnet"
webhook_url = "https://hooks.example.com/vault-webhook"

  [[contracts.rules]]
  type = "AnyTransaction"

  [[contracts.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"

  # FunctionCalled with argument matching: alert only when `transfer` is called
  # with `to` equal to the given address. Arguments are matched by position
  # (index starts at 0) against the invocation parameters.
  [[contracts.rules]]
  type          = "FunctionCalled"
  function_name = "transfer"
  args = [
    { index = 1, eq = "GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA" },
  ]

  # Rate rule: alert when the nested rule matches at least 3 times within a
  # sliding 5-minute window. One alert is emitted per breach with the observed
  # count.
  [[contracts.rules]]
  type           = "Rate"
  count          = 3
  window_seconds = 300
    [contracts.rules.rule]
    type = "TransactionFailed"

  # Rate rule: alert when `withdraw` is called at least 50 times per hour
  # (a typical exploit signal).
  [[contracts.rules]]
  type           = "Rate"
  count          = 50
  window_seconds = 3600
    [contracts.rules.rule]
    type          = "FunctionCalled"
    function_name = "withdraw"

  # Memo rule: alert on a specific memo ID or a memo text prefix. `memo_type`
  # is optional; when omitted, any memo type is matched.
  [[contracts.rules]]
  type      = "Memo"
  memo_type = "id"
  equals    = "123456789"

  [[contracts.rules]]
  type      = "Memo"
  memo_type = "text"
  prefix    = "EXCHANGE-"

  # A composite rule with a disabled nested entry: the config is preserved but
  # the disabled rule is not evaluated.
  [[contracts.rules]]
  type = "All"
    [[contracts.rules.rules]]
    type             = "HighFee"
    threshold_stroops = 100000
    enabled          = false

    [[contracts.rules.rules]]
    type = "AnyTransaction"

# Each [[contracts]] block is independent: rules, webhook_url, and network settings
# apply only to that contract. You can define different webhook receivers and alert
# rules per contract, even if they share the same network.

[[contracts]]
label       = "Mainnet Bridge Gateway"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CABAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAFNSZ"
# network must be one of: mainnet / testnet / futurenet
network     = "mainnet"
# webhook_url can differ per contract — this allows routing alerts to different endpoints
webhook_url = "https://hooks.example.com/bridge-webhook"
# webhook_secret = "another-secret-token"

  [[contracts.rules]]
  type          = "HighFee"
  threshold_stroops = 100000

  [[contracts.rules]]
  type = "TransactionFailed"

  # SourceAccount allowlist: alert when called by anyone except the known admin.
  # mode = "not_in" fires when the caller is NOT in accounts, and never fires
  # when the transaction has no source account.
  [[contracts.rules]]
  type = "All"
  [[contracts.rules.rules]]
  type     = "SourceAccount"
  mode     = "not_in"
  accounts = ["GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA"]
  # SourceAccount rule: alert when the known admin calls (deny fires when the
  # source IS in the list). To alert when anyone EXCEPT the admin calls, use a
  # Not rule wrapping a SourceAccount with allow = [...] instead.
  #
  #   allow = [addr]  →  fires when the source IS in the list
  #   deny  = [addr]  →  fires when the source IS in the list (same direction!)
  #
  # Both fire on a match; the difference is which direction "match" means for
  # your use-case. Use Not + allow to express "alert on everyone except X".
  [[contracts.rules]]
  type  = "SourceAccount"
  deny  = ["GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA"]
  severity = "warning"

  # Composite rule: alert only when withdraw is called AND amount is large
  [[contracts.rules]]
  type = "All"
  [[contracts.rules.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"
  [[contracts.rules.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 50000
